name: Registry validation

on:
  push:
    paths:
      - "registry/**/*.json"
      - "registry/*.csv"
      - "registry/INDEX.md"
      - "registry/schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "registry/**/*.json"
      - "registry/*.csv"
      - "registry/INDEX.md"
      - "registry/schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py --registry
      - run: python tests/test_validator_smoke.py
      - run: python scripts/generate_registry_views.py --check
      - run: python tests/test_generated_views.py
      - run: python tests/test_markdown_links.py
